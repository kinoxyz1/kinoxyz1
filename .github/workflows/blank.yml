name: generate breakout svg

on:
  schedule:
    - cron: "0 */24 * * *"
  workflow_dispatch:

jobs:
  generate-svg:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # generates a snake game from a github user (<github_user_name>) contributions graph, output a svg animation at <svg_out_path>
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            /tmp/github-contribution-grid-snake.svg
            /tmp/github-contribution-grid-snake-dark.svg?palette=github-dark
    
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move generated SVGs to temp
        run: |
          mkdir -p /tmp/breakout-images
          mv /tmp/github-contribution-grid-snake.svg /tmp/breakout-images/breakout-light.svg
          mv /tmp/github-contribution-grid-snake-dark.svg?palette=github-dark /tmp/breakout-images/breakout-dark.svg

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Commit and force-push SVGs to target branch
        run: |
          git checkout --orphan github-breakout
          git rm -rf .
          mkdir images
          mv /tmp/breakout-images/* images/
          git add images
          git commit -m "chore: update GitHub breakout SVGs" || echo "No changes to commit"
          git push --force origin github-breakout
